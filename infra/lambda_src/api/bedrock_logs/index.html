<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bedrock Invocation Logs</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --surface: #fffaf2;
      --ink: #1f1d1a;
      --accent: #0f766e;
      --accent-2: #b45309;
      --muted: #6b6157;
      --ok: #166534;    --ok-bg: #dcfce7;
      --warn: #9a3412;  --warn-bg: #fff7ed;
      --danger: #b91c1c;--danger-bg: #fef2f2;
      --border: #d8ccbd;
      --purple: #6d28d9; --purple-bg: #f5f3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI","Trebuchet MS",sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 0%,#fff7e8 0%,#f4f1ea 45%,#ebe5da 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 1300px; margin: 0 auto; padding: 24px 16px 56px; }

    /* Hero */
    .hero {
      border: 1px solid var(--border);
      background: linear-gradient(130deg,#fffaf2 0%,#f9f2e9 50%,#f3ece2 100%);
      border-radius: 18px; padding: 20px 24px;
      box-shadow: 0 18px 40px rgba(53,38,19,.08);
      margin-bottom: 18px;
      display: flex; align-items: flex-start;
      justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }
    .hero h1 { margin: 0 0 5px; font-size: clamp(1.3rem,2.5vw,1.9rem); }
    .hero p  { margin: 0; color: var(--muted); font-size: 0.88rem; }
    .hero-meta { display:flex; flex-direction:column; align-items:flex-end; gap:5px; font-size:0.8rem; color:var(--muted); }

    /* Controls bar */
    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 18px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
    }
    .ctrl-group { display: flex; flex-direction: column; gap: 4px; }
    .ctrl-group label { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
    .ctrl-group input, .ctrl-group select {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font: inherit; font-size: 0.88rem;
      background: #fff; color: var(--ink); min-width: 140px;
    }
    .btn {
      border: 0; border-radius: 10px; padding: 9px 18px;
      font: 600 0.85rem "Segoe UI",sans-serif;
      cursor: pointer; transition: transform .12s, opacity .12s;
      white-space: nowrap;
    }
    .btn:hover { transform: translateY(-1px); opacity: .92; }
    .btn-primary   { background: var(--accent); color: #f8fffe; }
    .btn-secondary { background: #ded3c3; color: #2b241d; }

    /* Stats row */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px; margin-bottom: 18px;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px;
    }
    .stat-card .stat-val { font-size: 1.6rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
    .stat-card .stat-lbl { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }

    /* Calendar browse */
    .browse-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px;
      margin-bottom: 18px;
    }
    .browse-panel h2 { margin: 0 0 14px; font-size: 1rem; }
    .cal-year { margin-bottom: 16px; }
    .cal-year h3 { margin: 0 0 8px; font-size: 0.9rem; color: var(--muted); }
    .cal-month { margin-bottom: 10px; padding-left: 12px; border-left: 2px solid var(--border); }
    .cal-month h4 { margin: 0 0 6px; font-size: 0.82rem; color: var(--accent-2); }
    .day-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-block; border-radius: 8px; padding: 4px 12px;
      font: 600 0.78rem "Segoe UI",sans-serif; cursor: pointer;
      border: 1px solid var(--border); background: #fff; color: var(--ink);
      text-decoration: none; transition: background .12s, border-color .12s;
    }
    .chip:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Hour bar (when a date is selected but no hour) */
    .hour-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .hour-chip {
      border-radius: 8px; padding: 6px 14px;
      font: 600 0.82rem "Segoe UI",sans-serif; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--ink);
      transition: background .12s, border-color .12s;
    }
    .hour-chip:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Filter bar */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-bottom: 14px;
    }
    .filter-bar input, .filter-bar select {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 10px; font: inherit; font-size: 0.85rem;
      background: #fff; color: var(--ink);
    }
    .filter-bar input { min-width: 200px; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th {
      background: #f3ede4; color: var(--muted); font-weight: 600;
      text-align: left; padding: 9px 10px;
      border-bottom: 1px solid var(--border); white-space: nowrap;
      position: sticky; top: 0; z-index: 1;
    }
    td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:hover td { background: #faf6f0; }
    tr.detail-row td { background: #fdf9f4; padding: 0; }
    .mono { font-family: "Cascadia Code","Consolas",monospace; font-size: 0.78rem; }

    /* Pill */
    .pill {
      display: inline-block; border-radius: 999px; padding: 2px 9px;
      font: 500 0.72rem "Segoe UI",sans-serif; white-space: nowrap;
    }
    .pill-ok     { background: var(--ok-bg);     color: var(--ok); }
    .pill-danger { background: var(--danger-bg); color: var(--danger); }
    .pill-purple { background: var(--purple-bg); color: var(--purple); }
    .pill-muted  { background: #f0ede8;          color: var(--muted); }
    .pill-warn   { background: var(--warn-bg);   color: var(--warn); }

    /* Token bar */
    .tok-bar {
      display: inline-flex; gap: 4px; align-items: center;
      font-size: 0.75rem; color: var(--muted); white-space: nowrap;
    }
    .tok-in  { color: var(--accent); font-weight: 600; }
    .tok-out { color: var(--accent-2); font-weight: 600; }

    /* Expand button */
    .exp-btn {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: 2px 7px; cursor: pointer; font-size: 0.72rem; color: var(--muted);
    }
    .exp-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Detail panel */
    .detail-panel { padding: 14px 16px; }
    .detail-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .dtab {
      border: 1px solid var(--border); background: #fff; border-radius: 8px;
      padding: 4px 12px; cursor: pointer; font: 600 0.78rem "Segoe UI",sans-serif;
      color: var(--muted);
    }
    .dtab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .json-block {
      background: #1e1e2e; color: #cdd6f4; border-radius: 10px;
      padding: 14px; font: 0.78rem "Cascadia Code","Consolas",monospace;
      overflow-x: auto; white-space: pre; line-height: 1.6; max-height: 400px; overflow-y: auto;
    }

    /* Truncation warning */
    .warn-box {
      background: var(--warn-bg); border: 1px solid #fdba74;
      border-radius: 10px; padding: 10px 14px; color: var(--warn);
      font-size: 0.85rem; margin-bottom: 14px;
    }

    /* Empty */
    .empty { text-align: center; padding: 40px; color: var(--muted); }

    @media (max-width: 640px) {
      .hero { flex-direction: column; }
      .hero-meta { align-items: flex-start; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <!-- Hero -->
  <div class="hero">
    <div>
      <h1>&#128196; Bedrock Invocation Logs</h1>
      <p id="hero-sub">Loading...</p>
    </div>
    <div class="hero-meta">
      <span id="hero-bucket"></span>
      <span id="hero-fetched"></span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="ctrl-group">
      <label>S3 Bucket</label>
      <input id="inp-bucket" type="text" placeholder="dmh-kb-docs">
    </div>
    <div class="ctrl-group">
      <label>Log Prefix</label>
      <input id="inp-prefix" type="text" style="min-width:320px" placeholder="airisk/AWSLogs/586794455900/BedrockModelInvocationLogs/eu-west-1">
    </div>
    <div class="ctrl-group">
      <label>Date</label>
      <input id="inp-date" type="date">
    </div>
    <div class="ctrl-group">
      <label>Hour (UTC)</label>
      <select id="inp-hour">
        <option value="">All hours (browse)</option>
        <option value="00">00</option><option value="01">01</option>
        <option value="02">02</option><option value="03">03</option>
        <option value="04">04</option><option value="05">05</option>
        <option value="06">06</option><option value="07">07</option>
        <option value="08">08</option><option value="09">09</option>
        <option value="10">10</option><option value="11">11</option>
        <option value="12">12</option><option value="13">13</option>
        <option value="14">14</option><option value="15">15</option>
        <option value="16">16</option><option value="17">17</option>
        <option value="18">18</option><option value="19">19</option>
        <option value="20">20</option><option value="21">21</option>
        <option value="22">22</option><option value="23">23</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="applyNav()">&#128269; Load Logs</button>
    <button class="btn btn-secondary" onclick="resetNav()">&#8635; Browse</button>
  </div>

  <!-- Dynamic content area -->
  <div id="main-content"></div>

</div>

<script>
(function () {
  const D = __LOG_DATA__;

  /* ── Helpers ── */
  function esc(v) {
    if (v == null) return '';
    return String(v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmtDate(v) {
    if (!v) return '—';
    try { return new Date(v).toLocaleString(); } catch { return esc(v); }
  }
  function shortModel(id) {
    if (!id) return '—';
    // Extract last segment: arn:...:model/name or just the ID
    const m = id.match(/\/([^/]+)$/);
    return m ? m[1] : id;
  }
  function navUrl(params) {
    const u = new URLSearchParams();
    if (params.bucket && params.bucket !== D.bucket) u.set('bucket', params.bucket);
    if (params.prefix && params.prefix !== D.prefix_base) u.set('prefix', params.prefix);
    if (params.date)  u.set('date',   params.date);
    if (params.hour)  u.set('hour',   params.hour);
    return '?' + u.toString();
  }

  /* ── Populate controls ── */
  document.getElementById('inp-bucket').value = D.bucket || '';
  document.getElementById('inp-prefix').value = D.prefix_base || '';
  document.getElementById('inp-date').value   = D.date || '';
  const hourSel = document.getElementById('inp-hour');
  if (D.hour) {
    for (let o of hourSel.options) if (o.value === D.hour) o.selected = true;
  }

  /* ── Hero meta ── */
  document.getElementById('hero-bucket').textContent = '&#128190; ' + (D.bucket || '');
  document.getElementById('hero-fetched').textContent = 'Fetched: ' + (D.fetched_at ? new Date(D.fetched_at).toLocaleString() : '');

  /* ── Navigation ── */
  window.applyNav = function() {
    const b = document.getElementById('inp-bucket').value.trim();
    const p = document.getElementById('inp-prefix').value.trim();
    const d = document.getElementById('inp-date').value;
    const h = document.getElementById('inp-hour').value;
    location.href = navUrl({ bucket: b, prefix: p, date: d, hour: h });
  };
  window.resetNav = function() {
    location.href = '?';
  };

  /* ── Main render ── */
  const contentEl = document.getElementById('main-content');

  if (D.records && D.records.length > 0 && D.date && D.hour) {
    renderLogs();
  } else if (D.browse && D.browse.level === 'hours') {
    renderHourBrowse();
  } else if (D.browse && D.browse.level === 'calendar') {
    renderCalendar();
  } else if (D.date && D.hour) {
    renderLogs(); // empty set
  } else {
    renderCalendar();
  }

  /* ── Calendar browse ── */
  function renderCalendar() {
    document.getElementById('hero-sub').textContent = 'Select a date to browse log files.';
    const browse = D.browse || {};
    const tree = browse.tree || {};

    if (browse.error) {
      contentEl.innerHTML = `<div class="warn-box">&#9888; S3 error: ${esc(browse.error)}</div>`;
      return;
    }

    const years = Object.keys(tree).sort().reverse();
    if (!years.length) {
      contentEl.innerHTML = `<div class="browse-panel"><div class="empty">&#128204; No log files found under this prefix.</div></div>`;
      return;
    }

    let html = '<div class="browse-panel"><h2>&#128197; Available Log Dates</h2>';
    years.forEach(yr => {
      html += `<div class="cal-year"><h3>${yr}</h3>`;
      const months = Object.keys(tree[yr]).sort();
      months.forEach(mo => {
        const days = tree[yr][mo];
        html += `<div class="cal-month"><h4>${yr}-${mo}</h4><div class="day-chips">`;
        days.forEach(dd => {
          const dateStr = `${yr}-${mo}-${dd}`;
          html += `<a class="chip" href="${esc(navUrl({date: dateStr}))}">${dd}</a>`;
        });
        html += '</div></div>';
      });
      html += '</div>';
    });
    html += '</div>';
    contentEl.innerHTML = html;
  }

  /* ── Hour browse ── */
  function renderHourBrowse() {
    const browse = D.browse || {};
    document.getElementById('hero-sub').textContent = `Select an hour for ${esc(D.date)}`;

    let html = `<h3 style="margin:0 0 10px;font-size:0.95rem;color:var(--muted)">
      &#128336; Available hours on ${esc(D.date)} (UTC)
    </h3>
    <div class="hour-bar">`;

    const hours = browse.hours || [];
    if (!hours.length) {
      html += '<span style="color:var(--muted);font-size:0.88rem">No log files found for this date.</span>';
    } else {
      hours.forEach(h => {
        html += `<a class="hour-chip" href="${esc(navUrl({date: D.date, hour: h}))}">${h}:00</a>`;
      });
    }
    html += '</div>';
    contentEl.innerHTML = html;
  }

  /* ── Log table ── */
  function renderLogs() {
    const records = D.records || [];

    document.getElementById('hero-sub').textContent =
      D.date && D.hour
        ? `${D.date} ${D.hour}:xx UTC  ·  ${records.length} record${records.length !== 1 ? 's' : ''}`
        : `${records.length} records`;

    // Stats
    let errors = 0, totalIn = 0, totalOut = 0, ops = {};
    records.forEach(r => {
      if (r.errorCode) errors++;
      const inTok  = r.input?.inputTokenCount  || 0;
      const outTok = r.output?.outputTokenCount || 0;
      totalIn  += inTok;
      totalOut += outTok;
      const op = r.operation || 'Unknown';
      ops[op] = (ops[op] || 0) + 1;
    });

    let statsHtml = '<div class="stats">';
    statsHtml += statCard(records.length, 'Total Invocations');
    statsHtml += statCard(errors,         'Errors',   errors > 0 ? 'color:var(--danger)' : '');
    statsHtml += statCard(records.length - errors, 'Successful', 'color:var(--ok)');
    statsHtml += statCard(totalIn.toLocaleString(),  'Input Tokens');
    statsHtml += statCard(totalOut.toLocaleString(), 'Output Tokens');
    statsHtml += statCard((totalIn + totalOut).toLocaleString(), 'Total Tokens');
    statsHtml += '</div>';

    // Unique model IDs and operations for filter dropdowns
    const modelSet = new Set(records.map(r => r.modelId).filter(Boolean));
    const opSet    = new Set(records.map(r => r.operation).filter(Boolean));

    let modelOpts = '<option value="">All Models</option>';
    [...modelSet].sort().forEach(m => { modelOpts += `<option value="${esc(m)}">${esc(shortModel(m))}</option>`; });

    let opOpts = '<option value="">All Operations</option>';
    [...opSet].sort().forEach(o => { opOpts += `<option value="${esc(o)}">${esc(o)}</option>`; });

    const filterHtml = `
      <div class="filter-bar">
        <input id="f-search" type="text" placeholder="Search request ID, model, identity..." oninput="applyFilter()">
        <select id="f-op"     onchange="applyFilter()">${opOpts}</select>
        <select id="f-model"  onchange="applyFilter()">${modelOpts}</select>
        <select id="f-status" onchange="applyFilter()">
          <option value="">All</option>
          <option value="ok">Success only</option>
          <option value="err">Errors only</option>
        </select>
        <span id="f-count" style="font-size:0.8rem;color:var(--muted);margin-left:4px"></span>
      </div>`;

    if (D.truncated) {
      statsHtml += `<div class="warn-box">&#9888; Results truncated — only the first ${records.length} records are shown. Narrow your time window to see all logs.</div>`;
    }

    // Build breadcrumb
    const crumbHtml = D.date ? `
      <div style="font-size:0.82rem;color:var(--muted);margin-bottom:12px">
        <a href="${esc(navUrl({}))}" style="color:var(--accent)">Browse</a>
        &rsaquo; <a href="${esc(navUrl({date: D.date}))}" style="color:var(--accent)">${esc(D.date)}</a>
        ${D.hour ? `&rsaquo; ${esc(D.hour)}:00 UTC` : ''}
      </div>` : '';

    // Table
    let tableHtml = `
      <div class="table-wrap">
      <table id="log-table">
        <thead><tr>
          <th></th>
          <th>Timestamp</th>
          <th>Operation</th>
          <th>Model</th>
          <th>Tokens In&nbsp;/&nbsp;Out</th>
          <th>Status</th>
          <th>Identity</th>
          <th>Inf. Region</th>
        </tr></thead>
        <tbody>`;

    records.forEach((r, i) => {
      const ts     = fmtDate(r.timestamp);
      const op     = r.operation || '—';
      const model  = shortModel(r.modelId);
      const inTok  = r.input?.inputTokenCount ?? '—';
      const outTok = r.output?.outputTokenCount ?? '—';
      const isErr  = !!r.errorCode;
      const statusHtml = isErr
        ? `<span class="pill pill-danger">&#9888; ${esc(r.errorCode)}</span>`
        : `<span class="pill pill-ok">&#10003; OK</span>`;
      const identity = r.identity?.arn
        ? r.identity.arn.split('/').pop()
        : '—';
      const infReg = r.inferenceRegion || '—';

      const rowData = JSON.stringify(r).replace(/</g,'\\u003c');
      const detailId = `detail-${i}`;

      tableHtml += `
        <tr class="data-row"
            data-op="${esc(op)}" data-model="${esc(r.modelId||'')}"
            data-status="${isErr ? 'err' : 'ok'}"
            data-search="${esc((r.requestId||'')+' '+(r.modelId||'')+' '+(r.identity?.arn||'')+' '+(r.errorCode||''))}">
          <td>
            <button class="exp-btn" onclick="toggleDetail(${i})">&#9660;</button>
          </td>
          <td class="mono">${esc(ts)}</td>
          <td><span class="pill pill-purple">${esc(op)}</span></td>
          <td class="mono" title="${esc(r.modelId||'')}">${esc(model)}</td>
          <td>
            <span class="tok-bar">
              <span class="tok-in">&#8595;${esc(String(inTok))}</span>
              <span>/</span>
              <span class="tok-out">&#8593;${esc(String(outTok))}</span>
            </span>
          </td>
          <td>${statusHtml}</td>
          <td class="mono" style="font-size:0.75rem" title="${esc(r.identity?.arn||'')}">${esc(identity)}</td>
          <td class="mono">${esc(infReg)}</td>
        </tr>
        <tr id="${detailId}" class="detail-row" style="display:none">
          <td colspan="8">
            <div class="detail-panel" id="detail-content-${i}"></div>
          </td>
        </tr>`;
    });

    tableHtml += '</tbody></table></div>';

    contentEl.innerHTML = crumbHtml + statsHtml + filterHtml + (records.length ? tableHtml : '<div class="empty">&#128204; No records found for this time window.</div>');

    // Store records on window for detail expand
    window._logRecords = records;
    updateFilterCount();
  }

  function statCard(val, label, style) {
    return `<div class="stat-card">
      <div class="stat-val" style="${style||''}">${val}</div>
      <div class="stat-lbl">${label}</div>
    </div>`;
  }

  /* ── Expand detail row ── */
  window.toggleDetail = function(i) {
    const row = document.getElementById(`detail-${i}`);
    const content = document.getElementById(`detail-content-${i}`);
    if (!row) return;
    const open = row.style.display !== 'none';
    row.style.display = open ? 'none' : '';
    if (!open && content && !content._rendered) {
      content._rendered = true;
      const r = window._logRecords[i];
      content.innerHTML = buildDetail(r);
    }
  };

  function buildDetail(r) {
    const tabs = [
      { id: 'full',   label: 'Full Record' },
      { id: 'input',  label: 'Input',  disabled: !r.input },
      { id: 'output', label: 'Output', disabled: !r.output },
    ].filter(t => !t.disabled);

    const uid = 'detail-' + r.requestId;

    let tabHtml = `<div class="detail-tabs">`;
    tabs.forEach((t, idx) => {
      tabHtml += `<button class="dtab${idx===0?' active':''}" onclick="switchDTab('${uid}','${t.id}',this)">${t.label}</button>`;
    });
    tabHtml += '</div>';

    let panelsHtml = '';
    tabs.forEach((t, idx) => {
      let data = r;
      if (t.id === 'input')  data = r.input;
      if (t.id === 'output') data = r.output;
      panelsHtml += `<div id="${uid}-${t.id}" class="dtab-panel" style="${idx>0?'display:none':''}">
        <div class="json-block">${esc(JSON.stringify(data, null, 2))}</div>
      </div>`;
    });

    return tabHtml + panelsHtml;
  }

  window.switchDTab = function(uid, tab, btn) {
    btn.closest('.detail-panel').querySelectorAll('.dtab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    btn.closest('.detail-panel').querySelectorAll('.dtab-panel').forEach(p => {
      p.style.display = p.id === `${uid}-${tab}` ? '' : 'none';
    });
  };

  /* ── Filter ── */
  window.applyFilter = function() {
    const q      = (document.getElementById('f-search')?.value || '').toLowerCase();
    const fOp    = document.getElementById('f-op')?.value    || '';
    const fModel = document.getElementById('f-model')?.value || '';
    const fSt    = document.getElementById('f-status')?.value || '';

    let visible = 0;
    document.querySelectorAll('#log-table tbody tr.data-row').forEach(row => {
      const nextRow = row.nextElementSibling; // detail row
      const show =
        (!q      || row.dataset.search.toLowerCase().includes(q)) &&
        (!fOp    || row.dataset.op    === fOp) &&
        (!fModel || row.dataset.model === fModel) &&
        (!fSt    || row.dataset.status === fSt);

      row.style.display     = show ? '' : 'none';
      if (nextRow && nextRow.classList.contains('detail-row')) {
        nextRow.style.display = show ? nextRow.style.display : 'none';
      }
      if (show) visible++;
    });
    updateFilterCount(visible);
  };

  function updateFilterCount(n) {
    const el = document.getElementById('f-count');
    if (!el) return;
    const total = (D.records || []).length;
    el.textContent = n != null && n !== total ? `${n} of ${total} shown` : `${total} records`;
  }

})();
</script>
</body>
</html>
